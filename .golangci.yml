version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Default
    - errcheck        # Check for unchecked errors
    - govet           # Reports suspicious constructs
    - ineffassign     # Detects unused variable assignments
    - staticcheck     # State-of-the-art Go linter
    - unused          # Check for unused code

    # Style
    - misspell        # Catch common misspellings

    # Bugs
    - bodyclose       # Check HTTP response body is closed
    - nilerr          # Check returning nil when err is not nil

    # Security
    - gosec           # Security-oriented static analysis

  settings:
    gosec:
      excludes:
        - G104  # Unhandled errors (covered by errcheck)
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment

  exclusions:
    rules:
      # Test files can have longer functions and unused parameters
      - path: _test\.go
        linters:
          - gosec
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports